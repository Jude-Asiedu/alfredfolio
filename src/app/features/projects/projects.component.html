<!-- Carousel variant (used inside Home) -->
<div class="container" *ngIf="variant === 'carousel'">
  <div class="section-eyebrow projects-eyebrow">A look at the work</div>
  <h2 class="section-title projects-title">My Projects</h2>

  <ngb-carousel class="projects-carousel mb-5" *ngIf="projects$ | async as projects">
    <ng-template ngbSlide *ngFor="let project of projects">
      <div class="carousel-slide">
        <img
          class="carousel-img"
          [src]="screenshotUrl(project.previewUrl)"
          [alt]="project.name + ' — live site screenshot'"
          loading="lazy"
          (error)="onPreviewError($event, project)" />
      </div>
    </ng-template>
  </ngb-carousel>
</div>

<!-- Grid variant (default — used by /projects route) -->
<div class="container py-5" *ngIf="variant === 'grid'">
  <h4 class="text-center textMain my-5 display-5 pt-5 fw-bolder">My Projects</h4>
  <div class="row g-4 px-md-4" *ngIf="projects$ | async as projects">
    <div class="col-12 col-md-6 col-xl-4" *ngFor="let project of projects">
      <article class="card project-card h-100 border-0 shadow-sm overflow-hidden">
        <!-- Browser-chrome live preview -->
        <a
          [href]="project.previewUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="browser-frame d-block"
          [attr.aria-label]="'Open ' + project.name + ' live site in new tab'">
          <div class="browser-chrome">
            <span class="browser-dot dot-red"></span>
            <span class="browser-dot dot-amber"></span>
            <span class="browser-dot dot-green"></span>
            <span class="browser-url ms-2">{{ project.previewUrl }}</span>
          </div>
          <div class="browser-viewport">
            <img
              [src]="screenshotUrl(project.previewUrl)"
              [alt]="project.name + ' preview'"
              loading="lazy"
              (error)="onPreviewError($event, project)" />
          </div>
        </a>

        <!-- Meta + CTA -->
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center mb-2">
            <i [ngClass]="project.stack.iconClasses" class="me-2 fs-5 textMain" aria-hidden="true"></i>
            <small class="text-muted">{{ project.stack.name }}</small>
          </div>
          <h5 class="card-title fw-bold mb-1">{{ project.name }}</h5>
          <p class="text-muted small mb-3">{{ project.period }}</p>
          <a
            [href]="project.previewUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-dark rounded-0 mt-auto align-self-start px-4"
            [attr.aria-label]="'Open ' + project.name + ' live site in new tab'">
            Visit site <i class="fas fa-external-link-alt ms-2" aria-hidden="true"></i>
          </a>
        </div>
      </article>
    </div>
  </div>
</div>
