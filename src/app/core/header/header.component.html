<div class="d-flex text-white w-100 align-items-center header justify-content-center py-2 ">
    <div class="d-flex justify-content-start cursor-pointer " routerLink="/">
        <h3 class="fw-light ms-4">AAJ</h3>
    </div>

    <div class="d-none d-md-flex flex-grow-1 justify-content-center align-items-start">
        <button type="button" class="ml-2 mr-2 btn btn-outline-light btn-sm  border-0 fw-light"
            *ngFor="let item of menuItems" [routerLink]="(isHome$ | async) ? item.homePath : item.pagePath" [fragment]="(isHome$ | async) ? item.fragment : ''"
            >{{item.title}}</button>
    </div>
    <div class="d-flex d-md-none justify-content-end flex-grow-1">
        <div ngbDropdown class="d-inline-block" display="dynamic" container="body">
            <button class="btn btn-btn-dark border-0" ngbDropdownToggle>
                <i class="fas fa-lg fa-bars"></i>
            </button>
            <div ngbDropdownMenu class="dropdown-menu dropdown-menu-right">
                <button ngbDropdownItem *ngFor="let item of menuItems"
                [routerLink]="(isHome$ | async) ? item.homePath : item.pagePath" [fragment]="(isHome$ | async) ? item.fragment : ''"
                >{{item.title}}</button>
            </div>
        </div>
    </div>
    <button class="btn btn-outline-light px-3 btn-sm  me-4 rounded-0">
      Resume
    </button>
</div>
